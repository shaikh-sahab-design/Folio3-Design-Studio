sk students, and automates personalized outreach, enabling advisors to provide timely, impactful support and improve overall student outcomes. The platform also provides actionable insights and analytics to help institutions make data-driven decisions and optimize their student support strategies."],tagline:"Empowering Student Growth with Risely",problem:"Higher education institutions struggle to provide timely, personalized support to students due to fragmented data across multiple systems and limited staff capacity. This often leads to delayed interventions, lower retention rates, and suboptimal student outcomes.",challenges:["Fragmented Data: Student information is spread across SIS, LMS, and CRM systems, making it hard to get a unified view.","Identifying At-Risk Students: Manually tracking students who need help is time-consuming and prone to error.","Scalability of Support: Limited staff resources make it difficult to provide personalized guidance to all students.","Timely Interventions: Delayed outreach reduces the effectiveness of support programs.","Data-Driven Decision Making: Institutions often lack actionable insights to optimize student success strategies."],facts:{industry:"EdTech",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/risely-hero.webp",label:"risely hero"},feature:{kind:"image",w:2400,h:1600,src:"assets/case/risely-feature.webp",label:"risely product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/risely-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/risely-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:593,src:"assets/case/risely-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/risely- 4,h:850,src:"assets/case/genopalate-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:866,src:"assets/case/genopalate-device-mockups.webp",label:"Device Mockups"}}]},"scottdale-bachelorette":{about:["Scottsdale is a top-tier bachelorette destination known for its year-round sunny weather, vibrant nightlife in the Old Town Entertainment District, and luxurious pool parties. It offers a perfect mix of desert adventures (hiking Camelback Mountain), relaxing spa days, and trendy dining. Key services like Scottsdale Bachelorette provide pre-arrival, themed home decorations, and itinerary planning."],tagline:"Your Ultimate Bachelorette Experience Starts Here",problem:"Scottsdale Bachelorette wanted to elevate its digital presence following a brand rebranding, moving away from an outdated website that lacked modern visuals, engaging interactions, and a seamless user experience. The goal was to create a premium, visually striking website that reflected the brand\u2019s new identity, showcased its experiences through immersive videos and animations, and delivered a polished experience beyond the limitations of generic WordPress layouts.",challenges:"The main challenge was to translate the brand\u2019s refreshed identity into a distinctive, high-end digital experience that stood out from competitors. This involved designing custom layouts, integrating engaging animations and video content, refining user journeys, and creating intuitive navigation that made discovering experiences and planning celebrations effortless. The focus was on balancing visual richness with performance and usability to deliver a sleek, memorable, and conversion-focused website.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/scottdale-bachelorette-hero.webp",label:"scottdale-bachelorette hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/scottdale-bachelorette-feature.webp",label:"scottdale-bachelorette product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:566,h:499,src:"assets/case/scottdale-bachelorette-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:566,h:499,src:"assets/case/scottdale-bachelorette-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:650,src:"assets/case/scottdale-bachelorette-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:568,src:"assets/case/scottdale-bachelorette-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:568,h:568,src:"assets/case/scottdale-bachelorette-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/scottdale-bachelorette-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/scottdale-bachelorette-device-mockups.webp",label:"Device Mockups"}}]},"sala-series":{about:["The SALA Series Podcast, hosted by Dalen Cuff and Monica McNutt, brings together purpose-driven leaders across sports, entertainment, corporate, and non-profit sectors to drive positive community change. It focuses on fostering meaningful relationships, featuring diverse voices, and discussing leadership, social impact, and, at times, arts and culture."],problem:"Sala Series needed a modern digital presence to showcase its brand, offerings, and unique identity through an engaging website. The goal was to create a memorable online experience that communicates the brand\u2019s value while connecting effectively with its target audience.",challenges:"Design a contemporary, visually compelling website with intuitive navigation, a clear content hierarchy, and consistent brand styling. Balance aesthetics with usability to deliver a seamless, responsive experience across desktop, tablet, and mobile devices.",facts:{industry:"Event Management",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:1136,src:"assets/case/sala-series-hero.webp",label:"sala-series hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/sala-series-feature.webp",label:"sala-series product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/sala-series-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/sala-series-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1154,h:641,src:"assets/case/sala-series-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/sala-series-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/sala-series-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/sala-series-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/sala-series-device-mockups.webp",label:"Device Mockups"}}]},"marthas-vineyard":{about:["Martha's Vineyard is a 96-square-mile island off the coast of Massachusetts, renowned as an upscale New England summer colony accessible only by air or ferry. It features iconic harbor towns like Edgartown and Oak Bluffs, sandy beaches, farmland, and a casual, bike-friendly atmosphere. Key attractions include the Gingerbread Cottages, Gay Head Cliffs, and filming locations from the movie Jaws."],problem:"Martha\u2019s Vineyard needed a modern, welcoming website to showcase mortgage-related services and guest houses for rent, helping visitors explore property options and find relevant information through a seamless digital experience.",challenges:"Design an intuitive, visually appealing website that balances property discovery with clear mortgage information. Create an engaging browsing experience with well-structured content, attractive property showcases, and easy navigation to help users explore rentals and access essential details effortlessly.",facts:{},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/marthas-vineyard-hero.webp",label:"marthas-vineyard hero"},feature:{kind:"image",w:1154,h:866,src:"assets/case/marthas-vineyard-feature.webp",label:"marthas-vineyard product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/marthas-vineyard-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/marthas-vineyard-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1154,h:641,src:"assets/case/marthas-vineyard-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/marthas-vineyard-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/marthas-vineyard-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/marthas-vineyard-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/marthas-vineyard-device-mockups.webp",label:"Device Mockups"}}]},dipgos:{about:["Indus Tech is a technology-driven consultancy specializing in delivering cutting-edge digital solutions to the Architecture, Engineering, and Construction (AEC) sector. Recognizing the increasing complexity and scale of modern infrastructure and real estate projects, Indus Tech envisioned a platform that could unify project governance across all lifecycle stages\u2014from planning and design to execution and operations. This led to the creation of DiPGOS (Digital Project Governance Operating System), an AI-powered platform designed to optimize large-scale project management through cognitive automation."],problem:"Dipgos needed a unified construction management platform to connect fragmented workflows, project data, and teams across multiple platforms. The goal was to simplify complex construction operations by bringing the entire project lifecycle into one intelligent, connected system.",challenges:"Design a scalable, multi-platform web app that manages complex construction workflows, large volumes of project data, and cross-functional collaboration. Create an intuitive interface that connects multiple systems, provides real-time project visibility, and enables teams to make informed decisions efficiently.",facts:{services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/dipgos-hero.webp",label:"dipgos hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/dipgos-feature.webp",label:"dipgos product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/dipgos-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/dipgos-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:639,src:"assets/case/dipgos-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/dipgos-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/dipgos-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/dipgos-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1156,h:870,src:"assets/case/dipgos-device-mockups.webp",label:"Device Mockups"}}]},"naked-wardrobe":{about:['Naked Wardrobe is a Los Angeles-based, women-owned online fashion brand founded in 2012 by sisters Shirin, Shida, and Shideh Kaviani. It specializes in "Original Sculpted Streetwear\u2122" and "shapewear basics without shapewear," designed to enhance curves with compressive technology. The brand is known for affordable, high-quality, form-fitting apparel, including bodysuits and dresses, often worn by celebrities like the Kardashians and Jennifer Lopez.'],problem:"Naked Wardrobe needed a modern mobile shopping experience that reflects its bold, fashion-forward brand identity while making it easier for customers to discover trending styles and shop effortlessly.",challenges:"Design a visually engaging, mobile-first interface with intuitive navigation, streamlined product discovery, and a frictionless checkout journey. Balance premium fashion aesthetics with usability to create a seamless and engaging shopping experience across the app.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/naked-wardrobe-hero.webp",label:"naked-wardrobe hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/naked-wardrobe-feature.webp",label:"naked-wardrobe product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/naked-wardrobe-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/naked-wardrobe-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:638,src:"assets/case/naked-wardrobe-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/naked-wardrobe-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/naked-wardrobe-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/naked-wardrobe-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/naked-wardrobe-device-mockups.webp",label:"Device Mockups"}}]},bmc:{about:["BMC is primed to accelerate transformation for our customers by connecting and amplifying hybrid IT with the most innovative portfolio of AI-driven infrastructure software."],problem:"BMC Software needed an intuitive web application experience to simplify complex enterprise software workflows and make critical business information easier to access. The goal was to improve usability and help users manage enterprise operations more efficiently.",challenges:"Design a scalable, data-driven interface that presents complex information, tools, and workflows in a clear, structured way. Balance enterprise-level functionality with intuitive navigation and a consistent user experience across different screens and user needs.",facts:{services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/bmc-hero.webp",label:"bmc hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/bmc-feature.webp",label:"bmc product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/bmc-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/bmc-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:638,src:"assets/case/bmc-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/bmc-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/bmc-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/bmc-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:868,src:"assets/case/bmc-device-mockups.webp",label:"Device Mockups"}}]},"land-teller":{about:["LandTeller is a specialized jobsite management software designed for land developers, contractors, and engineers to visualize construction projects on live, geotagged maps. Developed by Koliso Inc., it functions as a smartphone-first solution to bridge the gap between digital site plans and on-the-ground work."],problem:"Land aur on-site project management mein accurate spatial data aur work status ko manually track karna kafi mushkil hota hai, jis se team communication slow hoti hai aur reporting mein ghaltiyan aati hain. Real-time location-based updates aur instant assistance na hone ki wajah se site operations mein delays aur coordination issues paida hote hain.",challenges:"Complex georegistered site plans aur geotagged work tickets ko intuitive web app interface mein bina visual clutter ke seamlessly organize karna ek bada challenge tha. Iske sath sath ek interactive chatbot ko integrate karke field workers aur managers dono ke liye real-time data access aur navigation ko asaan banana zaroori tha.",facts:{industry:"Construction",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/land-teller-hero.webp",label:"land-teller hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/land-teller-feature.webp",label:"land-teller product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/land-teller-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/land-teller-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:638,src:"assets/case/land-teller-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/land-teller-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/land-teller-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/land-teller-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1156,h:870,src:"assets/case/land-teller-device-mockups.webp",label:"Device Mockups"}}]},"wood-mizer":{about:["At Wood-Mizer, everything we do is about the wood life. We know that every log represents more than a hobby or a job, more than an orange machine. It's about a positive influence on everyone who wants to do good with wood. It's a way of life. And we can't wait to live it with you."],problem:"Wood-Mizer needed a modern, user-friendly website to showcase its wood processing machinery, equipment, and solutions while helping customers easily find the right products for their needs.",challenges:"Design a clear, product-focused experience that organizes a wide range of machinery and technical information into intuitive navigation. Balance industrial functionality with a professional visual design to improve product discovery, accessibility, and customer engagement across devices.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/wood-mizer-hero.webp",label:"wood-mizer hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/wood-mizer-feature.webp",label:"wood-mizer product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/wood-mizer-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/wood-mizer-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1152,h:638,src:"assets/case/wood-mizer-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/wood-mizer-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/wood-mizer-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/wood-mizer-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1156,h:869,src:"assets/case/wood-mizer-device-mockups.webp",label:"Device Mockups"}}]},ingenius:{about:["InGenius offers college application counseling that is personalized to guarantee college admission success. It is a counseling and group-based classes service led by former college admissions officers to help students find a path to success in whatever fields they choose. InGenius are Former Admissions Officers from the most competitive schools. They are writers and editors from top graduate programs. They are professors, researchers, and scholars from U.S. universities. They are teaching fellows from Ivy League institutions. Together, they are your admissions team."],problem:"InGenius needed a user-friendly web app to simplify the college admissions journey by connecting students with expert counselors, personalized guidance, and group-based learning. The goal was to make the application process more structured, accessible, and less overwhelming.",challenges:"Design an intuitive platform that organizes counseling services, learning sessions, and admissions resources into a seamless experience. Build trust through a professional interface while making it easy for students to navigate their journey, access expert support, and track their progress.",facts:{industry:"EdTech",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1440,h:800,src:"assets/case/ingenius-hero.webp",label:"ingenius hero"},feature:{kind:"image",w:1152,h:864,src:"assets/case/ingenius-feature.webp",label:"ingenius product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:568,h:567,src:"assets/case/ingenius-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/ingenius-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1154,h:641,src:"assets/case/ingenius-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/ingenius-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:570,h:569,src:"assets/case/ingenius-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/ingenius-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1154,h:867,src:"assets/case/ingenius-device-mockups.webp",label:"Device Mockups"}}]},"va-navigator":{about:["VA Navigator helps Veterans find their way around VA medical centers. The app sets the nearest facility as their default, offers a searchable directory of clinics, pharmacies and amenities, and gives step-by-step indoor directions. It also remembers where they parked, links to travel claims, appointments and MyHealtheVet, and keeps the Veterans Crisis Line one tap away."],tagline:"One Solution for all VA Disability benefits Your Deserve",problem:"Large VA campuses span dozens of buildings and floors, and Veterans often arrive stressed, short on time or unfamiliar with the site. Signage alone leaves many lost between parking, check-in and their clinic.",challenges:"Designing for a wide range of ages and abilities, working with or without location access, showing multi-building indoor routes clearly on a small screen, and keeping urgent help visible without adding clutter.",facts:{services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/va-navigator-hero.webp",label:"va-navigator hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/va-navigator-feature.webp",label:"va-navigator product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/va-navigator-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/va-navigator-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/va-navigator-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/va-navigator-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/va-navigator-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/va-navigator-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/va-navigator-device-mockups.webp",label:"Device Mockups"}}]},"summit-k12":{about:["Summit K12 is a web-based educational platform providing interactive, standards-aligned supplemental curriculum across Science, Reading, and Social Studies. Designed for both classroom and remote learning, the platform accelerates growth for English learners and struggling students through mastery-based learning pathways, engaging video activities, and real-time progress tracking to ensure success on state assessments."],tagline:"Literacy, science and curriculum",problem:"SummitK12 supports K-12 teachers and students, but it doesn\u2019t work like a modern LMS. Fragmented products and inconsistent navigation make it hard to find, assign and review work, and hard to scale across assessment products.",challenges:"Products with different scoring models and terminology feel disconnected, and navigation between courses and content isn\u2019t predictable. Without a shared design system, teachers spend more effort finding content and reading student progress than they should.",facts:{industry:"EdTech",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/summit-k12-hero.webp",label:"summit-k12 hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/summit-k12-feature.webp",label:"summit-k12 product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/summit-k12-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/summit-k12-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:499,src:"assets/case/summit-k12-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/summit-k12-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/summit-k12-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/summit-k12-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/summit-k12-device-mockups.webp",label:"Device Mockups"}}]},cattlytics:{about:["Cattlytics is an all-in-one farm and livestock management platform built to streamline operations for beef, dairy, and livestock producers. The platform connects herd health tracking, breeding cycles, task management, and financial reporting into a single system, helping farmers and enterprise agribusinesses make data-driven decisions from birth to market."],tagline:"Manage livestock Farm effortlessly",problem:"Ranchers and dairy operators face major inefficiencies trying to manage large herds using legacy paper records or clunky, single-purpose tools. Without real-time visibility into herd metrics, health withdrawal periods, and feed efficiency, farm teams struggle to make timely, data-backed decisions.",challenges:"Designing a scalable digital workspace capable of organizing vast amounts of agricultural data into clear, actionable dashboards. The system needed to support diverse agricultural workflows\u2014from quick field entry on tablet screens to complex reporting and ERP integrations on desktop\u2014while keeping daily task management straightforward for all skill levels.",facts:{industry:"AgTech",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/cattlytics-hero.webp",label:"cattlytics hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/cattlytics-feature.webp",label:"cattlytics product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cattlytics-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cattlytics-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/cattlytics-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/cattlytics-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cattlytics-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/cattlytics-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/cattlytics-device-mockups.webp",label:"Device Mockups"}}]},artonista:{about:["Artonista is a direct-to-consumer online store for archival fine art prints with custom framing. It builds on more than 20 years of trade publishing through Mercurius Art Publishing. We designed the full e-commerce experience on a shared design system, from discovery and gallery walls through to checkout and support pages."],tagline:"Curated art for beautifully designed spaces",problem:"Buying art online is hard. Shoppers can\u2019t easily judge scale, framing or fit, so they settle for generic d\xE9cor. Artonista needed a store that makes quality art feel approachable and conveys its heritage and craftsmanship.",challenges:"We had to turn a B2B legacy into a warm consumer brand and feel premium yet accessible. We also had to build buyer confidence in a product people can\u2019t touch, support several ways to shop, and keep long-form and policy content readable within a restrained editorial look.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:701,src:"assets/case/artonista-hero.webp",label:"artonista hero"},feature:{kind:"image",w:1180,h:806,src:"assets/case/artonista-feature.webp",label:"artonista product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/artonista-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/artonista-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/artonista-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/artonista-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/artonista-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/artonista-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/artonista-device-mockups.webp",label:"Device Mockups"}}]},"bk-racing":{about:["BK Racing is a specialized motorsport performance brand engineering bulletproof powertrain and chassis components for GM Ecotec engines and circle track racing. Built by racers for racers, the platform offers track-proven engine builds, valvetrain upgrades, custom Dickinson roll cages, and technical guides that give drivers the reliability and performance needed to win on race day."],tagline:"One stop for all Your Racing Gears",problem:"BK Racing\u2019s original website struggled to support its expanding catalog of specialized racing components and technical guides. Drivers and mechanics found it difficult to locate specific engine parts, verify fitment, and navigate technical resources, leading to catalog friction and missed sales opportunities during high-intent purchases.",challenges:"The core design challenge was restructuring a deep, technical product catalog into a clear, intuitive navigation system that helps racers quickly find compatible GM Ecotec parts and installation guides without overwhelming them with dense automotive specifications.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:701,src:"assets/case/bk-racing-hero.webp",label:"bk-racing hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/bk-racing-feature.webp",label:"bk-racing product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/bk-racing-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/bk-racing-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/bk-racing-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/bk-racing-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/bk-racing-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/bk-racing-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/bk-racing-device-mockups.webp",label:"Device Mockups"}}]},"peplepet-matchwear":{about:["PeeplePet Matchwear is a custom apparel brand built around matching outfits for the whole family, pets included. Customers design tees and hoodies for themselves, their children and their dogs, preview them, and order the full set in one place. A separate kids\u2019 studio lets children design on their own."],tagline:"Turn Your Ideas Into Matching Memories",problem:"E-commerce customizers are designed for single-item shoppers. PeeplePet needed to serve complex family orders involving non-readers (kids) and non-standard fits (pets). Without visual reassurance, users struggled to envision how disparate garments would look together, driving drop-off.",challenges:"The core design challenge was balancing two distinct experiences: a streamlined interface for adults and a playful, accessible studio for young children. At the same time, artwork needed to translate consistently across vastly different adult, child, and pet garment sizes. Additionally, the homepage required a visual, low-copy approach that still built strong buyer confidence, ensuring families could easily visualize their complete matching sets before placing an order.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:701,src:"assets/case/peplepet-matchwear-hero.webp",label:"peplepet-matchwear hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/peplepet-matchwear-feature.webp",label:"peplepet-matchwear product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/peplepet-matchwear-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/peplepet-matchwear-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/peplepet-matchwear-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/peplepet-matchwear-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/peplepet-matchwear-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/peplepet-matchwear-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/peplepet-matchwear-device-mockups.webp",label:"Device Mockups"}}]},cargil:{about:["Cargill Dairy Enteligen is a data-driven dairy farm management platform designed to help farmers make smarter, more informed decisions. By combining herd performance, animal health, nutrition, and farm management data into one integrated system, it provides actionable insights to improve productivity and operational efficiency. The platform helps dairy producers identify growth opportunities, optimize farm practices, and make informed decisions that support long-term profitability."],tagline:"Creating A More Food Secure World",problem:"The existing Cargill Dairy Enteligen web app was built on Power BI, which limited flexibility in data visualization, report customization, and layout structures. Users faced challenges navigating multiple workflows and accessing insights efficiently. The goal was to redesign the experience from the ground up with a fully custom UI, bringing multiple workflows into one unified application while improving usability, data accessibility, and overall efficiency.",challenges:["Limited Visualization Flexibility: Existing Power BI charts and reporting capabilities restricted the ability to present complex dairy farm data in more meaningful and intuitive ways.","Rigid Layout Structures: The existing interface offered limited control over layouts and information hierarchy, making it difficult to create a tailored user experience.","Fragmented User Workflows: Multiple processes and data views needed to be consolidated into a single application to reduce navigation complexity and improve workflow continuity.","Complex Data Interpretation: Presenting large volumes of farm performance data in a clear, actionable format required a more thoughtful approach to information architecture and visualization.","Building a Custom UI from Scratch: Designing a scalable, cohesive interface beyond Power BI's constraints required rethinking the entire user experience while ensuring consistency across dashboards, reports, and workflows."],facts:{industry:"AgTech",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:701,src:"assets/case/cargil-hero.webp",label:"cargil hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/cargil-feature.webp",label:"cargil product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cargil-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cargil-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1181,h:498,src:"assets/case/cargil-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cargil-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/cargil-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/cargil-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:2360,h:1612,src:"assets/case/cargil-device-mockups.webp",label:"Device Mockups"}}]},"imprint-live":{about:["Imprint.live is a values-driven social networking platform designed to make online interactions more meaningful and impactful. It enables users to share their views on important social issues, connect through shared values, and contribute to causes that matter to them. By combining community engagement with a purpose-led approach, Imprint aims to create a safer, more respectful digital space where everyday online activity can inspire positive change."],tagline:"Help Your Teen Build Digital Confidence.",problem:"Imprint.live needed a visual refresh of its website to create a more modern, engaging, and professional digital presence. The existing website required improvements to its landing page and selected inner pages to better communicate the platform\u2019s value, present information clearly, and create a stronger first impression while retaining its core content and purpose.",challenges:"The main challenge was to redesign the landing page and key inner pages with a consistent visual identity and improved user experience. This involved refining the layout structure, typography, visual hierarchy, content presentation, and navigation to make the website more intuitive and visually appealing. The goal was to deliver a fresh, cohesive design that improves readability, guides visitors through the content, and strengthens the overall website experience.",facts:{industry:"AI/ML",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:701,src:"assets/case/imprint-live-hero.webp",label:"imprint-live hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/imprint-live-feature.webp",label:"imprint-live product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/imprint-live-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/imprint-live-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:500,src:"assets/case/imprint-live-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/imprint-live-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/imprint-live-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/imprint-live-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/imprint-live-device-mockups.webp",label:"Device Mockups"}}]},"game-golf":{about:["GameGolf KZN is a connected golf system where sensors on all 14 clubs record every shot automatically. This project redesigned the companion app, covering setup, the in-round course view, and the player\u2019s bag and profile, to make it as effortless as the hardware."],tagline:"Know More. Play Smarter.",problem:"The brand promises golfers they can \u201Cplay with absolute confidence,\u201D but the app fell short. Complex setup, crowded screens, and confusing navigation pulled attention away from the game and onto the app.",challenges:"Pairing 14 sensors made onboarding long and unclear, and screens were cluttered with every metric at once. Navigation didn\u2019t match how golfers think about a round. Everything also had to work at a glance, outdoors, between shots.",facts:{services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/game-golf-hero.webp",label:"game-golf hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/game-golf-feature.webp",label:"game-golf product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/game-golf-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/game-golf-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/game-golf-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/game-golf-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/game-golf-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/game-golf-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/game-golf-device-mockups.webp",label:"Device Mockups"}}]},hifonix:{about:["When you live for music Welcome to Hifonix. With nearly 20 years of hi-fi experience, we provide expert guidance and premium sound for every listener. Our love for exceptional sound has driven us for almost two decades. Ten years ago, we decided to turn this passion into a reality by opening Hifonix. Our store is more then just a place to buy gear; it's a heaven for music lover who appreciate the art and science of great sound."],tagline:"Artisan Audio & Head-Fi",problem:"Hifonix needed a distinctive digital presence that reflects its passion for artisan audio, premium Hi-Fi, and Head-Fi experiences. The goal was to create a modern luxury website that communicates the brand\u2019s expertise while making high-end audio feel immersive and approachable.",challenges:"Design a sophisticated, visually immersive website that balances luxury aesthetics with intuitive navigation and engaging interactions. Showcase premium audio products through refined layouts, rich visuals, and a seamless user experience that captures the craftsmanship and emotion of exceptional sound.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/hifonix-hero.webp",label:"hifonix hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/hifonix-feature.webp",label:"hifonix product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/hifonix-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/hifonix-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/hifonix-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/hifonix-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/hifonix-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/hifonix-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/hifonix-device-mockups.webp",label:"Device Mockups"}}]},"ai-guardian":{about:["AI Guardian is AI governance software that gives every employee one approved path to AI, while every prompt, document, agent, model, and business action passes through the same identity, policy, security, cost, and audit controls. Deploy the AI governance platform in your own cloud, connect Teams, Slack, web, and mobile, and govern AI usage in days."],tagline:"AI Governance Software",problem:"Organizations need a reliable way to identify AI risks, ensure compliance, and maintain control as they scale AI adoption. AI Guardian needed a clear, intuitive web app experience to make AI governance and security easier to understand and manage.",challenges:"Design a user-friendly interface that simplifies complex AI risk and compliance workflows while presenting critical insights clearly. Create a scalable, professional dashboard experience that helps organizations monitor risks, improve visibility, and adopt AI with confidence.",facts:{industry:"AI/ML",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/ai-guardian-hero.webp",label:"ai-guardian hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/ai-guardian-feature.webp",label:"ai-guardian product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/ai-guardian-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/ai-guardian-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/ai-guardian-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/ai-guardian-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/ai-guardian-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/ai-guardian-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/ai-guardian-device-mockups.webp",label:"Device Mockups"}}]},"redsky-lighting":{about:["There are places in the world where a light is not just a light. On offshore rigs, inside LNG terminals, across metal processing floors and marine vessels \u2014 light is the difference between safety and catastrophe. That is the world Red Sky Lighting was built for.","Since 2017, Red Sky has designed and engineered premium, durable LED lighting solutions for the most demanding harsh and hazardous environments on the planet. Based in California, we now serve clients across four continents. Every certification we hold, we've earned \u2014 through rigorous testing, careful material selection, and a refusal to cut corners. We don't just ship products. We ship trust."],problem:"The existing website needed a modern, professional experience that clearly communicated RedSky Lightening\u2019s services and value proposition. The challenge was to improve content clarity, visual appeal, and navigation while building trust with potential customers.",challenges:"Revamp the website with a clean, engaging UI, intuitive navigation, and a clear content hierarchy. Present complex service offerings in an accessible way while ensuring a consistent brand identity and a seamless, responsive experience across all devices.",facts:{industry:"E-commerce",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/redsky-lighting-hero.webp",label:"redsky-lighting hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/redsky-lighting-feature.webp",label:"redsky-lighting product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/redsky-lighting-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/redsky-lighting-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/redsky-lighting-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/redsky-lighting-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/redsky-lighting-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/redsky-lighting-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/redsky-lighting-device-mockups.webp",label:"Device Mockups"}}]},"dna-health":{about:["DNA Health is a personalised health platform that turns complex lab results into clear reports and health plans. It serves both patients and clinicians. It pairs a practitioner portal for doctors and nurses with a patient mobile app that brings lab results, wearable data and personalised health plans together in one place."],problem:"Patient health data is scattered across EMR records, lab reports, wearables and body scans, and it\u2019s written in clinical language patients can\u2019t easily understand. Doctors needed one secure workflow to review and approve insights, and patients needed a simple way to understand their results and follow their plan.",challenges:"Large volumes of biomarker, food intolerance and body-composition data had to become clear, accurate and patient-friendly views. At the same time, the platform had to enforce role-based access across six user types, and route automated EMR data, OCR extraction and AI insights through doctor approval before anything reached patients.",facts:{industry:"Digital Health",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:712,src:"assets/case/dna-health-hero.webp",label:"dna-health hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/dna-health-feature.webp",label:"dna-health product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/dna-health-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/dna-health-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1180,h:498,src:"assets/case/dna-health-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:568,h:499,src:"assets/case/dna-health-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/dna-health-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/dna-health-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/dna-health-device-mockups.webp",label:"Device Mockups"}}]},phi:{about:["Phi is a values-driven social networking platform designed to create a safer, more mindful, and inclusive online experience. It empowers teenagers and adults to share their thoughts, connect over meaningful issues, and engage with a community that values authenticity and respect. With proactive content moderation before posts go live, Phi aims to reduce harmful interactions and encourage more positive, purposeful digital engagement."],tagline:"Helping Humanity Thrive",problem:"PHI had an existing digital platform with an established structure and functionality, but the user experience was falling short of expectations. Several user flows had been developed without proper UI design, resulting in inconsistencies across the interface. The client needed a complete visual revamp that would improve usability and create a more polished, intuitive experience while preserving the existing structure and core functionality.",challenges:"The primary challenge was to modernize the platform without disrupting its established user flows or changing its core functionality. This involved refining the user experience, improving navigation and interaction patterns, establishing consistent typography and visual hierarchy, and bringing previously underdesigned flows into a cohesive design system. The goal was to deliver a fresh, contemporary look while maintaining familiarity for existing users.",facts:{industry:"AI/ML",services:"Web App, Mobile App Design, UX Design"},heroMedia:{kind:"image",w:1280,h:701,src:"assets/case/phi-hero.webp",label:"phi hero"},feature:{kind:"image",w:1180,h:850,src:"assets/case/phi-feature.webp",label:"phi product overview"},process:[{title:"Discovery & Brainstorming",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/phi-discovery.webp",label:"Discovery & Brainstorming"}},{title:"User Flow",size:"half",media:{kind:"image",w:565,h:499,src:"assets/case/phi-user-flow.webp",label:"User Flow"}},{title:"Moodboard & Visuals Direction",size:"full",media:{kind:"image",w:1181,h:566,src:"assets/case/phi-moodboard.webp",label:"Moodboard & Visuals Direction"}},{title:"Colors",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/phi-colors.webp",label:"Colors"}},{title:"Typography",size:"half",media:{kind:"image",w:565,h:498,src:"assets/case/phi-typography.webp",label:"Typography"}},{title:"Wireframes",size:"full",media:{kind:"image",w:1180,h:806,src:"assets/case/phi-wireframes.webp",label:"Wireframes"}},{title:"Device Mockups",size:"full",media:{kind:"image",w:1180,h:885,src:"assets/case/phi-device-mockups.webp",label:"Device Mockups"}}]}};var m1="Let's Collaborate",gl=m1,r0="Connect to Learn More",Rd="Trusted by 300+ global brands",c0=[{quote:"\u201CI love it! Many thanks to your team for getting us here. It was a fun & adventurous journey for me & I appreciate all the creative ideas & work put in to get us to this final product.\u201D",name:"Janine Axsom",role:"Creative Director | Marketing",org:"Wood-Mizer",logo:"assets/testimonials/woodmizer.webp"},{quote:"\u201CWe just wanted to say thank you for you and your team's work in the designs this week. We shared the Summit 360 and Prek-1 designs this morning with the team and the LOVED both! Our team was blown away by the depth and detail of the mock ups your team provided and everyone we showed them to was impressed and eager to see more!\u201D",name:"Jack Kresky",role:"Senior Product Lead",org:"Summit K12",logo:"assets/testimonials/summitk12.webp"},{quote:"We'd like to take this opportunity to extend our heartfelt thanks to the entire Imprint team at Folio3 for their dedication & hard work on the Imprint.live project. Your team's commitment has helped us create something very special, innovative, impactful, & full of potential. Being shortlisted for the Tech Awards 2025 stands as a true testament to the team's endeavour in delivering on our vision.",name:"Andrew & Harleen",role:"Imprint.live",org:"Imprint.live",logo:"assets/testimonials/imprintlive.webp"},{quote:"Now that we're live on all our platforms, I want to take a moment to thank you for the incredible effort you put into bringing our rebrand to life! This was no small project & we know it came with changing requirements, evolving scope & shifting timelines. Your flexibility & commitment ensured we not only hit our goal date but did so without hiccups. That is a huge accomplishment. We are excited to keep building alongside Folio3. We want to thank you again for being such an important partner in our journey. We could not have done it without you!",name:"Hannah Pekarek",role:"Product Manager",org:"GenoPalate",logo:"assets/testimonials/genopalate.webp"},{quote:"There is a great working relationship with the team that only continues to improve. The familiarity, expectations & processes for both parties continue to be better understood by each other helping create a more efficient workstream & product that accomplishes our varied objectives. The team works promptly & there is a healthy direct dialogue that has allowed us to prioritize & set expectations appropriately. We strongly value the perspective & opinions of the Folio3 team & are motivated & excited about what opportunities are ahead.",name:"Jimmy Craft",role:"Co-Founder, SALA Series & Partner, Foxrock Partners",org:"SALA Series",logo:"assets/testimonials/salaseries.webp"},{quote:"We want to share our utmost gratitude to you & everyone who has been part of bringing ClinicalPad to the live environment. Given that a platform will always have its share of issues throughout its journey, what impresses us most is how you & the team have dealt with delivering a premium product with minimal issues & the willingness to fix these issues promptly.",name:"Amri Shafeek",role:"Co-founder, CEO",org:"ClinicalPad",logo:"assets/testimonials/clinicalpad.webp"},{quote:"We are extremely satisfied with the Folio3 team & the dedicated efforts they have put into this project. We want to take this opportunity to thank you for your hard work & commitment. Despite the challenges of this complex project & our anticipation of potential delays, the process went relatively smoothly. We look forward to continuing our product development journey with this exceptional team.",name:"Rachel Li & Ron Koo",role:"CEO & Co-Founder",org:"LandTeller",logo:"assets/testimonials/landteller.webp"},{quote:"The entire Folio3 team has far exceeded my expectations with the service they ve provided in redesigning my website. Not only are they incredibly skilled in the design & technical work that they do, but each team member has been kind & professional every step of the way. They've made me feel like I am their only client & have been so responsive, proactive & accommodating in ensuring the experience for our customers is best-in-class.",name:"Casey Hohman",role:"CEO",org:"Scottsdale Bachelorette",logo:"assets/testimonials/sb.webp"}],Cd=(e,t=720,a=900)=>({kind:"image",label:e,w:t,h:a});var s0="From startups to industry icons \u2014 we turn visions into interactive realities.",za=[{slug:"ux-and-product-design",nav:"UX & Product Design",family:"design",title:"UX & Product Design that's human-led, AI-accelerated, and built around your business goals.",lead:"Seamless, intuitive, scalable product experiences \u2014 researched, designed, and validated faster than traditional studios can, without cutting the thinking.",hero:{...Cd("Hero visual \u2014 UX & Product Design",1360,586),src:"assets/services/hero.webp"},sections:[{type:"services",title:"What We Do",intro:"From research to final handoff, every stage is crafted with precision and purpose \u2014 with AI doing the heavy lifting so our designers can spend their time on judgement, not busywork.",items:[{title:"User Research & Strategy",body:"We uncover user behaviours, needs, and friction points, then turn them into design decisions. AI helps us synthesise interviews, reviews, and analytics in hours instead of weeks, so insights arrive while they still matter.",includes:["User Personas & Journey Mapping","AI-Assisted Research Synthesis & Sentiment Analysis","UX Audits & Heuristic Evaluations","Information Architecture","Use Case & Flow Prioritisation"],media:{kind:"image",label:"Research & strategy visual",w:1199,h:679,src:"assets/services/ux-1.webp"}},{title:"Wireframing & Prototyping",body:"Product structure is defined through clear wireframes and interactive prototypes. AI lets us generate and compare multiple flow directions early, then validate the strongest one with real users before visual design begins.",includes:["User Flows & Sitemaps","AI-Generated Layout Explorations","Low/Mid-Fidelity Wireframes","Interactive Prototypes","Rapid Testing & Iteration"],media:{kind:"image",label:"Wireframes visual",w:768,h:473,src:"assets/services/ux-2.webp"}},{title:"UX and UI",body:"We turn a solid UX foundation into refined, high-impact interfaces. AI accelerates variant exploration, copy, and imagery; our designers make the calls on hierarchy, brand, and feel.",includes:["High-Fidelity UI Screens","Design System Components","AI-Assisted UX Copy & Content Design","Accessibility Considerations (WCAG)","Responsive & Scalable Layouts","Motion & Micro-Interactions"],media:{kind:"image",label:"UI screens visual",w:1199,h:758,src:"assets/services/ux-3.webp"}},{title:"Design Systems & Handoff",body:"We build scalable, component-driven systems for consistency across every touchpoint. AI audits the library for drift and generates documentation and code-ready specs, so what we hand over is accurate and complete.",includes:["Figma Component Libraries","Style Guides & Tokens","Automated Consistency Audits","Dev-Ready Assets & AI-Generated Specs","Annotated Handoff Files","Cross-Team Collaboration Support"],media:{kind:"image",label:"Design system visual",w:1200,h:675,src:"assets/services/ux-4.webp"}}]},{type:"collab"},{type:"aiBand",title:"Human judgement. AI speed.",intro:"AI doesn't design your product \u2014 our people do. But it removes the slow, repetitive parts of the process, which means faster delivery, fewer errors, and more time spent on the decisions that actually move your metrics.",features:[{title:"Discover More. Move Faster.",body:"AI synthesises interviews, support tickets, reviews, and analytics into patterns. Designers validate them against context AI can't see \u2014 your business, your market, your constraints.",icon:"users"},{title:"Explore Beyond the Expected",body:"Instead of two or three concepts, we generate and pressure-test dozens. The best ideas surface earlier, and dead ends cost hours instead of sprints.",icon:"sparkle"},{title:"Design with precision",body:"AI checks accessibility, spacing, naming, and component consistency as we work. Every screen ships cleaner, and reviews focus on experience instead of hunting for inconsistencies.",icon:"pen"},{title:"Ship without rework",body:"Developers get accurate specs, documentation, and tokens generated straight from the source of truth. Fewer handoff questions, fewer implementation mismatches.",icon:"code"}],marquee:["Up to 50% faster","from research to validated prototype"],note:"Your data stays yours. We use AI tools under strict access controls and never train models on client material."},{type:"statement",text:"Whether you're building trust, boosting engagement, or reducing churn \u2014 it all starts with the experience. Now we get there faster.",button:!0},{type:"testimonials",title:"Words from the People We Design For",intro:"We\u2019ve been lucky to work with visionary brands and brilliant people \u2014 here\u2019s what they have to say about building with us"},{type:"benefits",title:"We make it move. You make it matter.",intro:"From startups to industry icons \u2014 we turn visions into interactive realities.",items:[{title:"Reduce Drop-Offs",body:"Streamlined experiences reduce friction and keep users moving.",icon:"chart"},{title:"Boost Conversions",body:"Better design = better outcomes. Whether it's signups, checkouts, or inquiries \u2014 we design flows that convert.",icon:"bag"},{title:"Shorten Onboarding Time",body:"Clarity at every step helps users get value faster. We simplify complex journeys into easy, confident first sessions.",icon:"users"},{title:"Strengthen Product Clarity",body:"We turn messy, confusing interfaces into intuitive ones \u2014 so users always know what to do next.",icon:"sparkle"},{title:"Scale Without Breaking UX",body:"Our systems-based approach, backed by AI consistency checks, keeps your product coherent as it grows across features, teams, and devices.",icon:"stack"},{title:"Increase Perceived Value",body:"People judge with their eyes. Thoughtful UX/UI instantly elevates how users feel about your product and brand.",icon:"trophy"}]},{type:"why",intro:"Our process blends research, prototyping, testing, and AI tooling to create intuitive, goal-driven designs \u2014 faster.",cards:{pro:"Senior designers lead every engagement. AI is a tool in their hands, not a substitute for their judgement.",tech:"We build AI into our workflow \u2014 research synthesis, generative exploration, automated QA \u2014 and update our stack as better tools arrive.",fast:"AI removes the slow parts of design. You see validated directions in days, not weeks, without skipping the research.",perfect:"Faster iteration means more rounds of refinement within the same timeline. We kee
